spring.application.name=pruabTech_Rolando

#para definir el puerto donde "escuchará" el servidor
server.port=80

#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

#Usuario y clave de creaTablas.sql
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-61518.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-61518-firebase-adminsdk-fbsvc-cd8a57fe0f.json

#Propiedades para enviar correos (activación de cuenta / recuperar contraseña)...
#IMPORTANTE: reemplace estos dos valores por su correo de Gmail y una "contraseña de aplicación"
#generada en https://myaccount.google.com/apppasswords (requiere verificación en 2 pasos activada).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CAMBIAR_POR_TU_CORREO@gmail.com
spring.mail.password=CAMBIAR_POR_TU_CLAVE_DE_APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

